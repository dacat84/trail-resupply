<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f12">
<title>Trail Resupply</title>
<meta name="description" content="Mobile resupply planner for US long trails: stops, services, distances and days">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Resupply">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@1,8..60,400&display=swap">
<link rel="stylesheet" href="style.css?v=meal1">
</head>
<body>
<div id="bg" class="bg"></div><div class="shade"></div>

<nav class="pills" id="nav">
  <button data-v="plan" class="tab active" data-i18n="tabPlan"></button>
  <button data-v="strat" class="tab" data-i18n="tabStrat"></button>
  <button data-v="info" class="tab" data-i18n="tabInfo"></button>
  <span class="sep"></span>
  <button id="t-units" class="tg" type="button" aria-label="km / mi"></button>
  <button id="t-lang" class="tg" type="button" aria-label="Sprache / Language"></button>
</nav>

<header class="head">
  <div class="k" id="kick"></div>
  <h1 id="htitle">Trail Resupply</h1>
  <p id="hsub"></p>
</header>

<main>
  <!-- PLANEN -->
  <section id="v-plan" class="view active">
   <div class="col-a">
    <div class="card">
      <label class="lbl" data-i18n="trail"></label>
      <select id="s-trail"></select>
      <div class="seg" id="s-dir"><button data-v="fwd"></button><button data-v="rev"></button></div>
    </div>

    <div class="card">
      <label class="lbl" data-i18n="start"></label>
      <select id="s-start"></select>
      <div id="start-info"></div>
    </div>

    <div class="card pace">
      <div class="mode"><label class="lbl"><span data-i18n="modeLbl"></span></label>
        <div class="seg" id="s-mode"><button data-v="km" id="m-km"></button><button data-v="food" id="m-food"></button></div></div>
      <div>
        <label class="lbl" id="l-pace"></label>
        <div class="stepper"><button data-step="-1">−</button><input id="s-pace" type="number" inputmode="numeric" min="5" max="80"><button data-step="1">+</button></div>
      </div>
      <div>
        <label class="lbl" data-i18n="buffer"></label>
        <div class="seg" id="s-buf"><button data-v="0">0</button><button data-v="0.5">½</button><button data-v="1">1</button></div>
      </div>
    </div>

    <div id="leg" class="card leg" hidden></div>

    <div id="route-box" class="card" hidden>
      <h2 class="sec2"><span data-i18n="myRoute"></span> <button id="r-clear" class="link" data-i18n="clear"></button></h2>
      <div id="route"></div>
    </div>
   </div>
   <div class="col-b">
    <h2 class="sec" data-i18n="nextStops"></h2>
    <div id="next" class="list"></div>
   </div>
  </section>

  <!-- STRATEGIE -->
  <section id="v-strat" class="view">
    <div class="col-a"><div class="card" id="strat-head"></div></div>
    <div class="col-b"><div id="strat" class="list"></div></div>
  </section>

  <!-- INFO -->
  <section id="v-info" class="view">
    <div class="card prose" id="info"></div>
  </section>
</main>

<div id="toast" class="toast"></div>
<script src="app.js?v=meal1"></script>
</body>
</html>
